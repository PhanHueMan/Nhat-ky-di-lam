name: Restore checklist item editor
on:
  push:
    paths:
      - .github/workflows/restore-home-button.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore edit and journal controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("checklist-lo-hang.html")
          s=p.read_text(encoding="utf-8")

          old="""function taskJournalKeys(item){
  return journalKeysForTask(item.text);
}"""
          new="""function taskJournalKeys(item){
  // Nếu người dùng đã tự cấu hình Nhật ký cho đầu việc thì ưu tiên cấu hình đó.
  // Nếu chưa từng cấu hình, dùng mapping mặc định đã siết chặt.
  return Array.isArray(item.journalKeys) ? item.journalKeys : journalKeysForTask(item.text);
}
const JOURNAL_OPTIONS = ['AN','MNF','EDO','Khai nháp TK','Tờ khai','Lấy TK thông quan','Lấy MV','SI','VGM','Bill draft','Bill (final)','Bill Sur'];

async function editItem(item){
  const newText = prompt('Tên đầu việc:', item.text);
  if(newText===null) return;
  const text = newText.trim();
  if(!text) return;

  const current = taskJournalKeys(item);
  const answer = prompt(
    'Cập nhật sang Nhật ký?\\n- Để trống = KHÔNG cập nhật\\n- Nhập một hoặc nhiều mục, cách nhau bằng dấu phẩy.\\n\\nCác mục: '+JOURNAL_OPTIONS.join(', '),
    current.join(', ')
  );
  if(answer===null) return;

  const wanted = answer.split(',').map(v=>v.trim()).filter(Boolean);
  const normalized = [];
  wanted.forEach(v=>{
    const found = JOURNAL_OPTIONS.find(o=>o.toLowerCase()===v.toLowerCase());
    if(found && !normalized.includes(found)) normalized.push(found);
  });

  item.text = text;
  item.journalKeys = normalized;
  await saveState();
  render();
}"""
          if old not in s: raise SystemExit("taskJournalKeys marker missing")
          s=s.replace(old,new,1)

          old2="""        row.innerHTML = `<span>${escapeHtml(it.text)}</span>`;
        const del = document.createElement('button');"""
          new2="""        const info = document.createElement('span');
        info.innerHTML = escapeHtml(it.text);
        const keys = taskJournalKeys(it);
        if(keys.length){
          const mark=document.createElement('small');
          mark.style.cssText='display:block;color:var(--done);font-weight:700;margin-top:3px;';
          mark.textContent='→ Nhật ký: '+keys.join(' + ');
          info.appendChild(mark);
        } else {
          const mark=document.createElement('small');
          mark.style.cssText='display:block;color:#8a8f98;margin-top:3px;';
          mark.textContent='Không cập nhật Nhật ký';
          info.appendChild(mark);
        }
        row.appendChild(info);

        const edit = document.createElement('button');
        edit.className = 'del-mini';
        edit.textContent = 'Sửa';
        edit.title = 'Sửa đầu việc và cài đặt cập nhật Nhật ký';
        edit.onclick = ()=>editItem(it);
        row.appendChild(edit);

        const del = document.createElement('button');"""
          if old2 not in s: raise SystemExit("manage row marker missing")
          s=s.replace(old2,new2,1)

          old3="""  const newItems = lines.map(function(text){ return {id:uid(), type:type, section:section, subsection:subsection, text:text, journalKeys:journalKeysForTask(text)}; });"""
          new3="""  const newItems = lines.map(function(text){ return {id:uid(), type:type, section:section, subsection:subsection, text:text}; });"""
          if old3 not in s: raise SystemExit("newItems marker missing")
          s=s.replace(old3,new3,1)

          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checklist-lo-hang.html
          git diff --cached --quiet || (git commit -m "Restore checklist item edit and journal controls" && git push)

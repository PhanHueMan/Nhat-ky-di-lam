name: Restore checklist home button
on:
  push:
    paths: ['.github/workflows/restore-home-button.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix shipment card customer label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('checklist-lo-hang.html')
          s = p.read_text(encoding='utf-8')
          old = "nameInput.value = shipment.name;"
          new = "nameInput.value = (String(shipment.customer||'').trim() && String(shipment.code||'').trim() ? String(shipment.customer).trim()+' '+String(shipment.code).trim() : (String(shipment.customer||'').trim() || String(shipment.code||'').trim() || String(shipment.name||'').trim() || 'Lô hàng chưa đặt tên'));"
          if old not in s:
              raise SystemExit('shipment card name marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checklist-lo-hang.html
          git diff --cached --quiet || (git commit -m "Show customer name on shipment cards" && git push)

name: Repair journal mapping syntax
on:
  push:
    paths:
      - '.github/workflows/restore-home-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('checklist-lo-hang.html')
          s=p.read_text(encoding='utf-8')
          bad="const auto = journalKeysForTask(item.text);\\n  if(item.journalManual===true) return Array.isArray(item.journalKeys) ? item.journalKeys : [];\\n  return auto;"
          good="""const auto = journalKeysForTask(item.text);
  if(item.journalManual===true) return Array.isArray(item.journalKeys) ? item.journalKeys : [];
  return auto;"""
          if bad not in s: raise SystemExit('bad syntax marker missing')
          s=s.replace(bad,good,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checklist-lo-hang.html
          git diff --cached --quiet || (git commit -m "Repair journal mapping syntax" && git push)

name: Repair journal mapping cleanly
on:
  push:
    paths:
      - '.github/workflows/restore-home-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix taskJournalKeys function
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('checklist-lo-hang.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function taskJournalKeys(item){')
          end=s.index('const JOURNAL_OPTIONS=', start)
          new='\n'.join([
            'function taskJournalKeys(item){',
            '  const auto = journalKeysForTask(item.text);',
            '  if(item.journalManual===true) return Array.isArray(item.journalKeys) ? item.journalKeys : [];',
            '  return auto;',
            '}',
            ''
          ])
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checklist-lo-hang.html
          git diff --cached --quiet || (git commit -m "Repair taskJournalKeys cleanly" && git push)

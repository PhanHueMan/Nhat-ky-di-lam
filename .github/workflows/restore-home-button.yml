name: Fix journal mapping
on:
  push:
    paths:
      - .github/workflows/restore-home-button.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mapping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("checklist-lo-hang.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("if(t === 'up mnf lên vnsw' || t.includes('khai mnf') || t.includes('up mnf')) keys.push('MNF');", "if(t === 'up mnf lên vnsw') keys.push('MNF');")
          s=s.replace("if(t.startsWith('phát hành edo') || t.includes('phát hành edo / đưa edo cho khách')) keys.push('EDO');", "if(t.startsWith('tạo edo') || t.startsWith('phát hành edo') || t.startsWith('đưa edo cho khách')) keys.push('EDO');")
          s=s.replace("if(t.startsWith('chỉnh sửa bill')) keys.push('Bill draft');", "if(t.startsWith('gửi bill nháp cho khách')) keys.push('Bill draft');")
          s=s.replace("if(t.startsWith('xem lại fms bill đã đúng chưa, phát hành hbl') || t.includes('phát hành hbl')) keys.push('Bill (final)');", "if(t.startsWith('xem lại fms bill đã đúng chưa, phát hành hbl') || t.startsWith('phát hành hbl')) keys.push('Bill (final)');")
          s=s.replace("if(t.startsWith('lấy bill sur về gửi khách') || t.includes('bill sur')) keys.push('Bill Sur');", "if(t.startsWith('lấy bill sur về gửi khách')) keys.push('Bill Sur');")
          s=s.replace("return Array.isArray(item.journalKeys) ? item.journalKeys : journalKeysForTask(item.text);", "return journalKeysForTask(item.text);")
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checklist-lo-hang.html
          git diff --cached --quiet || (git commit -m "Fix journal mapping duplicates" && git push)

name: Clean stale journal mappings
on:
  push:
    paths:
      - '.github/workflows/restore-home-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean old auto mappings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('checklist-lo-hang.html')
          s=p.read_text(encoding='utf-8')
          old="return Array.isArray(item.journalKeys) ? item.journalKeys : journalKeysForTask(item.text);"
          new="""const auto = journalKeysForTask(item.text);
  if(item.journalManual===true) return Array.isArray(item.journalKeys) ? item.journalKeys : [];
  // Dữ liệu cũ từng bị auto-map quá rộng: bỏ journalKeys cũ và tính lại theo rule chuẩn.
  return auto;"""
          if old not in s: raise SystemExit('taskJournalKeys marker missing')
          s=s.replace(old,new,1)
          old2="item.journalKeys=answer.split(',').map(v=>v.trim()).filter(Boolean).map(v=>JOURNAL_OPTIONS.find(o=>o.toLowerCase()===v.toLowerCase())).filter((v,i,a)=>v&&a.indexOf(v)===i);"
          new2="item.journalKeys=answer.split(',').map(v=>v.trim()).filter(Boolean).map(v=>JOURNAL_OPTIONS.find(o=>o.toLowerCase()===v.toLowerCase())).filter((v,i,a)=>v&&a.indexOf(v)===i); item.journalManual=true;"
          if old2 not in s: raise SystemExit('edit marker missing')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checklist-lo-hang.html
          git diff --cached --quiet || (git commit -m "Ignore stale automatic journal mappings" && git push)

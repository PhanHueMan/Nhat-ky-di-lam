='cut off si');if(!lab)return;const inp=row.querySelector('input[type="date"],input[type="datetime-local"]');if(inp&&inp.type!=='datetime-local'){const old=inp.value;inp.type='datetime-local';if(old&&!old.includes('T'))inp.value=old+'T00:00';}})};fixCutoff();new MutationObserver(fixCutoff).observe(d.body,{childList:true,subtree:true});const resize=()=>{f.style.height=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight)+20+'px'};resize();new ResizeObserver(resize).observe(d.body);setTimeout(resize,300)}catch(e){console.error(e)}}f.addEventListener('load',tune);</script></body></html>
